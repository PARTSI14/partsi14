<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Stelios Partsinevelos - Blue Team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06122b"/>
      <stop offset="1" stop-color="#0b2a5c"/>
    </linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#94a3b8"/>
      <stop offset="0.7" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="boss" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#475569"/>
    </radialGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#64748b"/>
    </radialGradient>
    <linearGradient id="steelV2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- right: radar -->
  <defs><radialGradient id="sweep" cx="0" cy="1" r="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient></defs>
  <g transform="translate(1068 140)">
    <g fill="none" stroke="#38bdf8" opacity="0.45"><circle r="105"/><circle r="72"/><circle r="38"/>
      <path d="M-105 0 H105 M0 -105 V105"/></g>
    <path d="M0 0 L0 -105 A105 105 0 0 1 74 -74 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="44" cy="-58" r="6" fill="#ef4444"/><circle cx="44" cy="-58" r="8" fill="none" stroke="#ef4444" stroke-width="2">
      <animate attributeName="r" values="8;20;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-50" cy="30" r="4" fill="#22c55e"/><circle cx="20" cy="62" r="4" fill="#22c55e"/><circle cx="-30" cy="-60" r="4" fill="#22c55e"/>
  </g>

  <!-- two crossed swords behind the shield -->
  <g transform="translate(153 141) rotate(-40) scale(1.22) translate(-151 0)">
    <path d="M78 -7 H262 L284 0 L262 7 H78 Z" fill="url(#steelV2)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M80 0 H258" stroke="#64748b" stroke-width="1.6"/>
    <path d="M80 -5 H256" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <rect x="66" y="-20" width="12" height="40" rx="4" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.5"/>
    <circle cx="72" cy="-21" r="4" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.2"/>
    <circle cx="72" cy="21" r="4" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.2"/>
    <rect x="26" y="-5.5" width="40" height="11" rx="3" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M32 -5 L36 5 M40 -5 L44 5 M48 -5 L52 5 M56 -5 L60 5" stroke="#60a5fa" stroke-width="1.4"/>
    <circle cx="18" cy="0" r="9" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.5"/>
    <circle cx="18" cy="0" r="3.5" fill="#3b82f6"/>
  </g>
  <g transform="translate(153 141) rotate(-140) scale(1.22) translate(-151 0)">
    <path d="M78 -7 H262 L284 0 L262 7 H78 Z" fill="url(#steelV2)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M80 0 H258" stroke="#64748b" stroke-width="1.6"/>
    <path d="M80 -5 H256" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <rect x="66" y="-20" width="12" height="40" rx="4" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.5"/>
    <circle cx="72" cy="-21" r="4" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.2"/>
    <circle cx="72" cy="21" r="4" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.2"/>
    <rect x="26" y="-5.5" width="40" height="11" rx="3" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M32 -5 L36 5 M40 -5 L44 5 M48 -5 L52 5 M56 -5 L60 5" stroke="#60a5fa" stroke-width="1.4"/>
    <circle cx="18" cy="0" r="9" fill="url(#gold)" stroke="#7c5a10" stroke-width="1.5"/>
    <circle cx="18" cy="0" r="3.5" fill="#3b82f6"/>
  </g>

  <!-- armour shield (knight's heater shield) -->
  <g transform="translate(73 52) scale(0.8)">
    <!-- outer steel rim -->
    <path d="M100 0 C140 0 175 6 200 16 V92 C200 156 160 198 100 222 C40 198 0 156 0 92 V16 C25 6 60 0 100 0 Z" fill="url(#steel)" stroke="#0f172a" stroke-width="3"/>
    <!-- blue field -->
    <path d="M100 14 C134 14 164 19 186 27 V93 C186 147 152 184 100 206 C48 184 14 147 14 93 V27 C36 19 66 14 100 14 Z" fill="url(#field)"/>
    <!-- steel cross bands -->
    <path d="M90 15 H110 V205 C106 207 103 208 100 209 C97 208 94 207 90 205 Z" fill="url(#steelV)" opacity="0.95"/>
    <path d="M14 80 H186 V100 H14 Z" fill="url(#steel)" opacity="0.95"/>
    <!-- central boss -->
    <circle cx="100" cy="90" r="26" fill="url(#boss)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="93" cy="82" r="8" fill="#ffffff" opacity="0.55"/>
    <!-- rivets on the rim -->
    <g fill="url(#rivet)" stroke="#0f172a" stroke-width="1">
      <circle cx="22" cy="24" r="5"/><circle cx="60" cy="12" r="5"/><circle cx="140" cy="12" r="5"/><circle cx="178" cy="24" r="5"/>
      <circle cx="8" cy="60" r="5"/><circle cx="192" cy="60" r="5"/><circle cx="10" cy="120" r="5"/><circle cx="190" cy="120" r="5"/>
      <circle cx="35" cy="172" r="5"/><circle cx="165" cy="172" r="5"/><circle cx="100" cy="214" r="5"/>
    </g>
    <!-- light highlight on the steel -->
    <path d="M100 4 C64 4 32 10 8 19 V60 C30 40 64 28 100 26 Z" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- text -->
  <text x="300" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#38bdf8">BLUE TEAM</text>
  <text x="300" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Stelios Partsinevelos</text>
  <text x="300" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">Threat Intelligence · Detection Engineering · Incident Response</text>
  <text x="300" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">Threat Hunting · Cloud Security · ICS/OT Security</text>
  <!-- skill badges -->
  <g><rect x="300" y="226" width="132" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="366.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">MITRE ATT&amp;CK</text><rect x="442" y="226" width="68" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="476.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">Sigma</text><rect x="520" y="226" width="56" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="548.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">KQL</text><rect x="586" y="226" width="76" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="624.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">Splunk</text><rect x="672" y="226" width="152" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="748.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">Microsoft Sentinel</text><rect x="834" y="226" width="80" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="874.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">SPARTA</text><rect x="924" y="226" width="62" height="30" rx="15" fill="#0f2a5a" stroke="#3b82f6" stroke-width="1.5"/><text x="955.0" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bfdbfe" text-anchor="middle">NIS2</text></g>
</svg>
